<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SeeBrowser</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%23111a2e'/%3E%3Cpath d='M8 50 Q50 8 92 50 Q50 92 8 50Z' fill='none' stroke='%232dd4bf' stroke-width='7'/%3E%3Ccircle cx='50' cy='50' r='16' fill='%238b5cf6'/%3E%3Ccircle cx='50' cy='50' r='7' fill='%23fff'/%3E%3C/svg%3E" />
  </head>
  <body>
    <!-- ====== SVG icon sprite ====== -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
        <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="i-reload" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 3v4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1v-9Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
        <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
        <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3 12h18M12 3c2.5 2.6 3.9 5.7 3.9 9S14.5 18.4 12 21c-2.5-2.6-3.9-5.7-3.9-9S9.5 5.6 12 3Z" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
        <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 17l-5.4 2.8 1.1-6.1L3.2 9.4l6.1-.8L12 3Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
        <symbol id="i-star-f" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 17l-5.4 2.8 1.1-6.1L3.2 9.4l6.1-.8L12 3Z" fill="currentColor"/></symbol>
        <symbol id="i-menu" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="19" r="1.8" fill="currentColor"/></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
        <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v11m0 0l-4-4m4 4l4-4M4 19h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="i-history" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 1 2.5 6M3.5 12H7M3.5 12L5.6 9.2M12 7v5l3.5 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.5L6 21V3Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
        <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
        <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.4 7.7-8 9-4.6-1.3-8-4.5-8-9V6l8-3Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.4 0 2-1 2-2 0-.6-.3-1-.8-1.4-.6-.5-.4-1.6.5-1.6H17a4 4 0 0 0 4-4c0-4.4-4-8-9-8Z" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="7.5" cy="10" r="1.3" fill="currentColor"/><circle cx="11" cy="7.2" r="1.3" fill="currentColor"/><circle cx="15.5" cy="9.5" r="1.3" fill="currentColor"/></symbol>
        <symbol id="i-incog" viewBox="0 0 24 24"><path d="M4 10a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M2 14h20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="7.5" cy="17.5" r="2.4" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="16.5" cy="17.5" r="2.4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9.9 17.5h4.2" stroke="currentColor" stroke-width="1.7"/></symbol>
        <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 4h6l-1 6 3 3H7l3-3-1-6ZM12 13v7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></symbol>
        <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" transform="translate(2 1)" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
        <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2m-9 0l1 15h8l1-15M10 11v6m4-6v6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="i-min" viewBox="0 0 24 24"><path d="M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
        <symbol id="i-max" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
        <symbol id="i-up" viewBox="0 0 24 24"><path d="M5 15l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="i-down" viewBox="0 0 24 24"><path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
        <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
        <symbol id="i-code" viewBox="0 0 24 24"><path d="M8 6l-5 6 5 6M16 6l5 6-5 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4L11 13M9 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      </defs>
    </svg>

    <div id="app">
      <!-- ======= Tab strip / title bar ======= -->
      <div id="tabstrip-row">
        <div id="brand" title="SeeBrowser">
          <svg class="ic brand-ic"><use href="#i-eye"/></svg>
          <span class="brand-name">See</span>
        </div>
        <button id="btn-tabsearch" class="icon-btn ts-btn" data-i18n-title="searchTabs"><svg class="ic sm"><use href="#i-down"/></svg></button>
        <div id="tabs" role="tablist" data-tauri-drag-region></div>
        <button id="btn-newtab" class="icon-btn" data-i18n-title="newTab"><svg class="ic"><use href="#i-plus"/></svg></button>
        <div id="drag-region" data-tauri-drag-region></div>
        <div id="win-controls">
          <button id="win-min" class="win-btn"><svg class="ic sm"><use href="#i-min"/></svg></button>
          <button id="win-max" class="win-btn"><svg class="ic sm"><use href="#i-max"/></svg></button>
          <button id="win-close" class="win-btn danger"><svg class="ic sm"><use href="#i-x"/></svg></button>
        </div>
      </div>

      <div id="main-col">
        <!-- ======= Toolbar ======= -->
        <div id="toolbar">
          <button id="btn-back" class="icon-btn" data-i18n-title="back"><svg class="ic flip-rtl"><use href="#i-back"/></svg></button>
          <button id="btn-fwd" class="icon-btn" data-i18n-title="forward"><svg class="ic flip-rtl"><use href="#i-fwd"/></svg></button>
          <button id="btn-reload" class="icon-btn" data-i18n-title="reload"><svg class="ic"><use href="#i-reload"/></svg></button>
          <button id="btn-home" class="icon-btn" data-i18n-title="home"><svg class="ic"><use href="#i-home"/></svg></button>

          <div id="omnibox">
            <button id="omni-icon" data-i18n-title="siteInfo"><svg class="ic sm"><use href="#i-search"/></svg></button>
            <input id="omni-input" type="text" spellcheck="false" autocomplete="off" data-i18n-ph="omniboxPh" />
            <button id="omni-zoom" class="hidden" data-i18n-title="mZoomReset">100%</button>
            <span id="omni-engine" title="Search engine"></span>
            <button id="btn-star" class="icon-btn in-omni" data-i18n-title="bookmark"><svg class="ic sm"><use href="#i-star"/></svg></button>
            <div id="omni-progress"></div>
          </div>

          <button id="btn-shield" class="icon-btn" data-i18n-title="adblock"><svg class="ic"><use href="#i-shield"/></svg><span id="shield-count" class="badge hidden">0</span></button>
          <button id="btn-downloads" class="icon-btn" data-i18n-title="downloads"><svg class="ic"><use href="#i-download"/></svg><span id="dl-badge" class="badge hidden">0</span></button>
          <button id="btn-theme" class="icon-btn" data-i18n-title="toggleTheme"><svg class="ic"><use href="#i-moon"/></svg></button>
          <button id="btn-menu" class="icon-btn" data-i18n-title="menu"><svg class="ic"><use href="#i-menu"/></svg></button>
        </div>

        <!-- ======= Bookmarks bar ======= -->
        <div id="bookmarks-bar"></div>

        <!-- ======= Find bar ======= -->
        <div id="find-bar" class="hidden">
          <input id="find-input" type="text" data-i18n-ph="findPh" />
          <span id="find-count"></span>
          <button id="find-prev" class="icon-btn"><svg class="ic sm"><use href="#i-up"/></svg></button>
          <button id="find-next" class="icon-btn"><svg class="ic sm"><use href="#i-down"/></svg></button>
          <button id="find-close" class="icon-btn"><svg class="ic sm"><use href="#i-x"/></svg></button>
        </div>

        <!-- ======= Content ======= -->
        <main id="content">
          <div id="webview-anchor"></div>
          <div id="page-ghost" class="hidden">
            <svg class="ghost-ic"><use href="#i-eye"/></svg>
            <div id="ghost-title"></div>
            <div id="ghost-url"></div>
          </div>
          <section id="internal-page" class="hidden"></section>
        </main>
      </div>
    </div>

    <!-- Omnibox suggestions -->
    <div id="omni-suggest" class="popup hidden"></div>
    <!-- Main menu -->
    <div id="main-menu" class="popup hidden"></div>
    <!-- Tab context menu -->
    <div id="tab-menu" class="popup hidden"></div>
    <!-- Tab search (Ctrl+Shift+A) -->
    <div id="tab-search" class="popup hidden">
      <input id="tab-search-input" type="text" autocomplete="off" data-i18n-ph="searchTabsPh" />
      <div id="tab-search-list"></div>
    </div>
    <!-- Site information -->
    <div id="site-info" class="popup hidden"></div>
    <!-- Toast -->
    <div id="toast" class="hidden"></div>
    <!-- Demo banner (only when running in a regular browser, not the app) -->
    <div id="demo-banner" class="hidden"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
