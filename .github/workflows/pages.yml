name: Deploy website (GitHub Pages)

# Publishes the website/ folder to GitHub Pages:
#   https://manixpcshot.github.io/SeeBrowser/
#
# Method: classic branch publishing (pushes website/ to the `gh-pages`
# branch). The maintainer hosts the site on their own domain, so this is
# now MANUAL-ONLY: run it from the Actions tab if GitHub Pages hosting is
# ever wanted (Settings → Pages → Deploy from a branch → gh-pages).
# Every GitHub Release also carries `SeeBrowser-website.zip` for any
# static host.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish website/ to the gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp -r website "$RUNNER_TEMP/site"
          cd "$RUNNER_TEMP/site"
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy SeeBrowser website (${{ github.sha }})"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
