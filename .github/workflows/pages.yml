name: Deploy website (GitHub Pages)

# Publishes the website/ folder to GitHub Pages:
#   https://manixpcshot.github.io/SeeBrowser/
#
# Method: classic branch publishing. The workflow pushes the site to the
# `gh-pages` branch on every change to website/. For a public repository,
# GitHub Pages enables itself automatically the first time a `gh-pages`
# branch appears — no manual Settings step and no admin token needed
# (the Actions deploy-pages method requires a pre-created Pages site,
# which only a repo admin can create).
on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish website/ to the gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp -r website "$RUNNER_TEMP/site"
          cd "$RUNNER_TEMP/site"
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy SeeBrowser website (${{ github.sha }})"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
